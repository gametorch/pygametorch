name: Publish

# Publishes to PyPI via Trusted Publishing (OIDC, no long-lived tokens).
#
# The workflow filename must stay "workflow.yml" because that is what is
# registered with the pending Trusted Publishers on TestPyPI and PyPI.
#
# TestPyPI: GitHub environment "testpypi"
# PyPI:      GitHub environment "pypi"
#
# Triggers:
#   - Push to main that bumps src/gametorch/_version.py: the version is tagged,
#     a GitHub Release is created and the package is published to PyPI. Skipped
#     when the tag already exists, so re-pushes are safe.
#   - Publishing a GitHub Release -> PyPI (manual fallback).
#   - Manual run -> choose testpypi or pypi.
#
# The version bump itself stays manual (see RELEASING.md); CI only tags and
# releases once the bumped version lands on main.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "src/gametorch/_version.py"
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Resolve version and tag state
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^__version__ = "(.*)"/\1/p' src/gametorch/_version.py)"
          if [ -z "$version" ]; then
            echo "could not read __version__ from src/gametorch/_version.py" >&2
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag ${tag} already exists; nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag ${tag} is new; will release ${version}"
          fi

  build:
    name: Build distributions
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
          python-version: "3.14"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Validate metadata
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"

      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, detect]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.index == 'pypi') ||
      (github.event_name == 'push' && needs.detect.outputs.release == 'true')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  tag-release:
    name: Tag and create GitHub release
    # Runs after a successful publish so a tagged version is always on PyPI.
    needs: [detect, publish-pypi]
    if: github.event_name == 'push' && needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
